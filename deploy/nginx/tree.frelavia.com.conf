# tree.frelavia.com (Team app) — nginx front door
# ----------------------------------------------------------------------------
# Public routes:
#   https://tree.frelavia.com/           -> 127.0.0.1:2440  (pm2: team-frontend, Next.js HTTP)
#   https://tree.frelavia.com/backend/*  -> 127.0.0.1:6017  (pm2: team-backend, strips /backend)
#
# LAN self-signed HTTPS on :2439 is unchanged; nginx terminates public TLS on :443
# with a temporary self-signed cert until DNS points here and certbot is run:
#   sudo certbot --nginx -d tree.frelavia.com \
#        --redirect --agree-tos --no-eff-email
# ----------------------------------------------------------------------------

upstream frelavia_backend {
    server 127.0.0.1:6017;
    keepalive 16;
}

upstream frelavia_frontend {
    server 127.0.0.1:2440;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name tree.frelavia.com;

    ssl_certificate     /etc/ssl/certs/tree.frelavia.com.crt;
    ssl_certificate_key /etc/ssl/private/tree.frelavia.com.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Bid screenshots are data URLs; profile-generator payloads can be large.
    client_max_body_size 16m;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header Connection        "";

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Browser API base is `${origin}/backend` (Next rewrite). Nginx talks to
    # the backend directly so /backend/api/auth/login -> :6017/api/auth/login.
    location /backend/ {
        proxy_pass http://frelavia_backend/;
        proxy_read_timeout    600s;
        proxy_send_timeout    600s;
        proxy_connect_timeout 75s;
    }

    location = /backend {
        return 301 /backend/;
    }

    location / {
        proxy_pass http://frelavia_frontend;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    access_log /var/log/nginx/tree.frelavia.access.log;
    error_log  /var/log/nginx/tree.frelavia.error.log;
}
